name = "ikc-checkin-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Created with:  npx wrangler d1 create ikc-checkin
# Paste the printed database_id below.
[[d1_databases]]
binding = "DB"
database_name = "ikc-checkin"
database_id = "9b44c409-c7dd-42fa-b22e-0ebc54cd8470"

[vars]
# Only the published site may call this API from a browser. Add more origins
# comma-separated if you ever move to a custom domain.
ALLOWED_ORIGINS = "https://hbwoody.github.io"

# ADMIN_KEY is a secret, not a var. Set it with:
#   npx wrangler secret put ADMIN_KEY
